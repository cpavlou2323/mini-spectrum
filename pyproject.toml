[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "mini-spectrum"
version = "1.0.0"
description = "A tiny always-on-top spectrum analyser and oscilloscope for whatever your Windows PC is playing."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Christos P" }]
requires-python = ">=3.9"
dependencies = [
    "numpy",
    "pyaudiowpatch; sys_platform == 'win32'",
]
classifiers = [
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Topic :: Multimedia :: Sound/Audio :: Analysis",
    "Environment :: Win32 (MS Windows)",
]

# "mini-spectrum" opens the widget without a console window
[project.gui-scripts]
mini-spectrum = "mini_spectrum.app:main"

[tool.setuptools]
packages = ["mini_spectrum"]

[tool.setuptools.package-data]
mini_spectrum = ["icon.ico"]
